name: GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to release, for example v1.0.0.0 (push it first)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  version:
    name: Check the tag
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against Cargo.toml
        id: tag
        uses: ./.github/actions/tag-version
        with:
          tag: ${{ inputs.tag }}

  tests:
    name: Tests
    needs: version
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.version.outputs.commit }}

  release:
    name: Build and release
    needs: [version, tests]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false

      - name: Install the Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set $env:RUST_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version

      - name: Build
        shell: cmd
        run: build.bat

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create $env:TAG build_output/GameToaster.exe --verify-tag --title "GameToaster $env:VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
